name: Lembar Fakta (factsheet)

# Menjalankan factsheet.py di cloud (akses D1) dan meng-commit hasilnya ke
# content/factsheet/latest.json — supaya proses penulisan artikel (yang
# berjalan di luar) bisa membaca ANGKA yang dihitung kode, bukan mengarang.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly atau trend"
        default: "weekly"
        required: false
      trend_id:
        description: "id tren utk mode trend, mis. google:xxx"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: factsheet
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (untuk wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps collector
        run: pip install -r collector/requirements.txt

      - name: Resolve D1 database id
        run: |
          set -e
          DB_ID="$(npx --yes wrangler@4 d1 list --json 2>/dev/null \
            | jq -r '.[]? | select(.name=="lagitren-db") | (.uuid // .database_id // .id // empty)' \
            | head -n1)"
          if [ -z "$DB_ID" ]; then
            echo "::error::Tidak menemukan database D1 lagitren-db."
            exit 1
          fi
          echo "CLOUDFLARE_D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Hitung lembar fakta
        working-directory: collector
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ env.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          mkdir -p ../content/factsheet
          MODE="${{ github.event.inputs.mode }}"
          TREND="${{ github.event.inputs.trend_id }}"
          [ -z "$MODE" ] && MODE="weekly"
          if [ "$MODE" = "trend" ] && [ -n "$TREND" ]; then
            python factsheet.py trend "$TREND" > ../content/factsheet/latest.json
          else
            python factsheet.py weekly > ../content/factsheet/latest.json
          fi

      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/factsheet/latest.json
          git diff --cached --quiet && echo "Tidak ada perubahan." && exit 0
          git commit -m "factsheet: perbarui content/factsheet/latest.json [skip ci]"
          git pull --rebase origin main
          git push origin main
