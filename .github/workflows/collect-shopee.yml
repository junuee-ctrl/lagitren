name: Kumpulkan Produk Viral (harian)

# 5-1 (insiden 2026-08-18): Produk macet 4 hari karena TIDAK ADA jadwal —
# hanya dispatch manual. Sekarang dijadwalkan tiap hari supaya data
# (products.csv / Google Sheet) selalu tersinkron ke D1.
on:
  schedule:
    - cron: "30 5 * * *" # tiap hari 05:30 UTC (12:30 WIB)
  workflow_dispatch:

concurrency:
  group: collect-shopee
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Link CSV Google Sheet berisi produk afiliasi TikTok Shop (publik).
      SHOPPING_SHEET_CSV: ${{ vars.SHOPPING_SHEET_CSV }}
      GEO: "ID"
      LANG: "id"
      USE_OLLAMA: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (untuk wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps collector
        run: pip install -r collector/requirements.txt

      - name: Resolve D1 database id
        run: |
          set -e
          DB_ID="$(npx --yes wrangler@4 d1 list --json 2>/dev/null \
            | jq -r '.[]? | select(.name=="lagitren-db") | (.uuid // .database_id // .id // empty)' \
            | head -n1)"
          if [ -z "$DB_ID" ]; then
            echo "::error::Tidak menemukan database D1 lagitren-db."
            exit 1
          fi
          echo "CLOUDFLARE_D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Jalankan collector Produk (shopee)
        working-directory: collector
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ env.CLOUDFLARE_D1_DATABASE_ID }}
        run: python main.py shopee
